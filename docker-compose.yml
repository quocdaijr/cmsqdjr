version: '3.8'

# CmsQDJr v2.0 Docker Services
# Minimal Setup: Nginx + PHP 8.4 + MySQL + Redis (4 services)
# Full Setup: Add Elasticsearch 8.x and/or RabbitMQ (optional)

services:
    # ============================================
    # REQUIRED SERVICES (Minimal Setup)
    # ============================================

    lar_nginx:
        image: nginx:alpine
        container_name: lar_nginx
        volumes:
            - '.:/var/www/html/cmsqdjr'
            - './docker/nginx/conf.d:/etc/nginx/conf.d'
            - './docker/nginx/logs:/var/log/nginx'
        expose:
            - 80
            - 443
        dns:
            - 8.8.8.8
            - 4.4.4.4
        network_mode: "host"

    lar_php84:
        image: quocdaijr/php-fpm:8.4
        container_name: lar_php84
        working_dir: /var/www/html/cmsqdjr
        volumes:
            - '.:/var/www/html/cmsqdjr'
            - './docker/php84/supervisor/conf.d:/etc/supervisor/conf.d'
            - './docker/php84/supervisor/logs:/var/log/cache'
            - './docker/php84/php-fpm/conf.d/php-ini-overrides.ini:/etc/php/8.4/fpm/conf.d/99-overrides.ini'
        expose:
            - 9000
        dns:
            - 8.8.8.8
            - 4.4.4.4
        network_mode: "host"

    # ============================================
    # OPTIONAL SERVICES (Commented by default)
    # ============================================
    # Uncomment services below based on your needs:
    # - Elasticsearch: For better search performance (set ELASTICSEARCH_ENABLED=true in .env)
    # - RabbitMQ: For high-volume queue processing (set QUEUE_CONNECTION=rabbitmq in .env)

    # Elasticsearch 8.x (OPTIONAL - for better search performance)
    # Uncomment only if ELASTICSEARCH_ENABLED=true in .env
#    lar_elasticsearch8:
#        image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
#        container_name: lar_elasticsearch8
#        environment:
#            - discovery.type=single-node
#            - xpack.security.enabled=false
#            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
#        volumes:
#            - ./docker/elasticsearch8/data:/usr/share/elasticsearch/data
#        expose:
#            - 9200
#            - 9300
#        dns:
#            - 8.8.8.8
#            - 4.4.4.4
#        network_mode: "host"

    # RabbitMQ 3.13 (OPTIONAL - for high-volume queue processing)
    # Uncomment only if QUEUE_CONNECTION=rabbitmq in .env
#    lar_rabbitmq:
#        image: rabbitmq:3.13-management-alpine
#        container_name: lar_rabbitmq
#        environment:
#            RABBITMQ_DEFAULT_USER: guest
#            RABBITMQ_DEFAULT_PASS: guest
#        volumes:
#            - './docker/rabbitmq/data:/var/lib/rabbitmq'
#        expose:
#            - 5672   # AMQP port
#            - 15672  # Management UI
#        dns:
#            - 8.8.8.8
#            - 4.4.4.4
#        network_mode: "host"

    lar_mysql:
        image: quocdaijr/msql:8.0
        container_name: lar_mysql
        volumes:
            - './docker/mysql/data:/var/lib/mysql'
        environment:
            - MYSQL_ROOT_PASSWORD=12345@
            - MYSQL_DATABASE=cmsqdjr
            - MYSQL_USER=basic-user
            - MYSQL_PASSWORD=basic-password
        expose:
            - 3306
        dns:
            - 8.8.8.8
            - 4.4.4.4
        network_mode: "host"

    lar_redis:
        image: redis:7.2-alpine
        container_name: lar_redis
        volumes:
            - './docker/redis/data:/data'
        expose:
            - 6379
        dns:
            - 8.8.8.8
            - 4.4.4.4
        network_mode: "host"
